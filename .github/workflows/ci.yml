name: Taqwright CI

# Runs on every push and PR — this is the "trigger on every change" pipeline.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast feedback: types + test discovery, no device needed ──────────────────
  static:
    name: Typecheck & list tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: List tests (validates taqwright.config.ts loads)
        run: npx taqwright test --project android-ci --list

      - name: List iOS tests (validates the ios-ci project loads)
        run: npx taqwright test --project ios-ci --list

  # ── Real run on a GitHub-hosted Android emulator ─────────────────────────────
  android-emulator:
    name: Android emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm i -g appium@next
          appium driver install uiautomator2

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD and generate a snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Taqwright suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_UDID: emulator-5554
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices
            npx taqwright test --project android-ci

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taqwright-report-api${{ matrix.api-level }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ── Real run on a GitHub-hosted iOS simulator ────────────────────────────────
  # Requires app/way2automation.app (a simulator build) — see IOS_APP_PATH in
  # taqwright.config.ts. This job will fail until that build is added or IOS_APP_PATH
  # points at one produced elsewhere in the pipeline.
  ios-simulator:
    name: iOS simulator (${{ matrix.device }})
    runs-on: macos-14
    needs: static
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 15']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Appium + XCUITest driver
        run: |
          npm i -g appium@next
          appium driver install xcuitest

      - name: Resolve and boot the simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const runtimes=JSON.parse(s).devices;
                for (const list of Object.values(runtimes)) {
                  const hit=list.find(d=>d.name==='${{ matrix.device }}');
                  if (hit) { console.log(hit.udid); process.exit(0); }
                }
                process.exit(1);
              })")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Run Taqwright suite on the simulator
        env:
          IOS_UDID: ${{ steps.sim.outputs.udid }}
        run: npx taqwright test --project ios-ci

      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taqwright-report-ios-${{ matrix.device }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
